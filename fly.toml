app = "cmf-downloader"
primary_region = "scl"

[build]

[processes]
  web    = "uvicorn main:app --host 0.0.0.0 --port 8080"
  worker = "python worker.py"

[http_service]
  internal_port        = 8080
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1
  processes            = ["web"]

[[vm]]
  size = "shared-cpu-1x"
